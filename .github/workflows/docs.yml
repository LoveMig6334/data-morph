name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # Project runtime deps + the docs group only. Skip the dev group: it pulls
      # mlx-lm/mlx-vlm, which are Apple-Silicon-only and would fail on the Linux runner.
      # mkdocstrings imports `datamorph`, whose docs path needs no MLX (it's lazy).
      - run: uv sync --no-default-groups --group docs
      - run: uv run mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
