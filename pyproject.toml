[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-morph"
version = "0.1.0"
description = "Distill a CSV/JSON/TXT file-conversion capability from Claude Opus into a fine-tuned Gemma 2B (LoRA/QLoRA)."
readme = "README.md"
requires-python = ">=3.12"
# Minimal runtime deps: the generated conversion scripts (and the loadability
# metric) use pandas; huggingface_hub downloads the published model on first use.
# Inference needs MLX — installed via the `mlx` extra, which is Apple-Silicon-only,
# so it is kept out of the base requirements.
dependencies = [
    "huggingface-hub>=0.30",
    "pandas>=3.0.2",
]

[project.optional-dependencies]
mlx = [
    "mlx-lm>=0.31.3",
    "mlx-vlm>=0.5.0",
]

[dependency-groups]
# Local development installs MLX too (the notebooks + pipeline eval need it),
# so the inference deps are listed here as well as in the optional `mlx` extra
# that downstream users install via `pip install "data-morph[mlx]"`.
dev = [
    "faker>=40.19.1",
    "hf-transfer>=0.1.9",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "mlx-lm>=0.31.3",
    "mlx-vlm>=0.5.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.hatch.build.targets.wheel]
# Dist name is "data-morph"; the import package is "datamorph" (no underscore),
# so name it explicitly rather than relying on the default name inference.
packages = ["datamorph"]

[tool.pytest.ini_options]
markers = [
    "performance: opt-in slow tests; run with `pytest -m performance`",
    "teacher: live Claude Opus calls via `claude -p` (opt-in; run with `pytest -m teacher`)",
]
addopts = "-m 'not performance and not teacher'"
